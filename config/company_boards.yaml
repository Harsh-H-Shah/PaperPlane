# =============================================================================
# Top-company job boards
# =============================================================================
# Curated list of top companies to pull roles from, one entry per company.
# Adding a company = adding one line here (no code change).
#
# Fields:
#   company  - display name
#   ats      - greenhouse | lever | ashby | smartrecruiters | workable | workday | custom
#   token    - board slug used by that ATS's public API
#   adapter  - (custom only) named adapter in company_boards.py (amazon, netflix)
#   endpoint - (workday/custom) full API URL, kept for the future adapter
#   enabled  - if false, the fetcher skips it (kept in the list for later)
#
# Verified live against each ATS API on 2026-07-01 by the `verify-company-boards`
# workflow. Re-run that workflow periodically to catch ATS/token drift.
# Disabled entries are on a bespoke, script-hostile career API that needs a custom
# big-tech adapter (Microsoft/Google/Apple/Meta) — see docs/JOB_INGESTION_PLAN.md.
# Greenhouse/Lever/Ashby/SmartRecruiters/Workable/Workday adapters are all live.
# =============================================================================

