name: Deploy PaperPlane

# Backend (only when VM_HOST is set): image built here, pushed to GHCR, pulled
# by the VM. A home server behind a Cloudflare Tunnel needs no backend deploy.
# Frontend: static export published to GitHub Pages.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   API_URL  e.g. https://paperplane-api.harshsh.com   (enables the frontend deploy)
#   VM_HOST  the VM's external IP                       (enables the backend deploy)
#   VM_USER  your SSH username on the VM
# Repository secret:
#   SSH_PRIVATE_KEY  private key whose public half is on the VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint backend
        run: |
          cd backend
          pip install ruff
          ruff check src/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:8080' }}

  build-backend:
    name: Build backend image
    needs: test
    # Only needed when the backend runs on a VM; a home server builds locally.
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/harsh-h-shah/paperplane-backend:latest
            ghcr.io/harsh-h-shah/paperplane-backend:${{ github.sha }}

  deploy-backend:
    name: Deploy backend (Google Cloud VM)
    needs: build-backend
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Pull and restart on the VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$HOME/paperplane"
            git pull --ff-only origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker logout ghcr.io

            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/stats > /dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Backend did not become healthy"
            docker compose -f docker-compose.prod.yml logs --tail 50 backend
            exit 1

  deploy-frontend:
    name: Deploy frontend (GitHub Pages)
    needs: test
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - id: deployment
        uses: actions/deploy-pages@v4
